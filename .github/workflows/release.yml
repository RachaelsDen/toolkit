name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test suite before building (expect 596 tests, aggregate == discovery)
        run: |
          python -m unittest pr_guard.pr_guard_test 2>&1 | tee aggregate.log | tail -3
          grep -q "^OK" aggregate.log
          A=$(grep -oE 'Ran [0-9]+' aggregate.log | grep -oE '[0-9]+')
          python -m unittest discover -s . -t . -p "pr_guard*_test.py" 2>&1 | tee discovery.log | tail -3
          grep -q "^OK" discovery.log
          D=$(grep -oE 'Ran [0-9]+' discovery.log | grep -oE '[0-9]+')
          if [ "$D" != "596" ] || [ "$A" != "596" ] || [ "$D" != "$A" ]; then
            echo "MISMATCH: aggregate=$A discovery=$D (expected 596/596)"
            exit 1
          fi
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build the zipapp (dist/pr-guard.pyz)
        run: |
          mkdir -p dist/stage
          cp -r pr_guard dist/stage/pr_guard
          find dist/stage -name "__pycache__" -type d -exec rm -rf {} +
          python -m zipapp dist/stage \
            --python "/usr/bin/env python3" \
            --main "pr_guard.cli:run" \
            --output dist/pr-guard.pyz
          ls -l dist/
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*
